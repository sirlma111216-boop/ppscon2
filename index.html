      try { if (!localStorage.getItem('ppscon2.center.v1')) { var art = document.createElement('link'); art.rel = 'preload'; art.as = 'image'; art.href = '/center/campus-v3/exterior-0.webp'; document.head.appendChild(art) } } catch (error) { /* the picture still loads with the title screen */ }
    </script>
  </head>

    <noscript>이 게임은 자바스크립트를 켜야 실행됩니다.</noscript>
